name: Deploy Firebase (Hosting + Functions)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        run: npm install --prefix functions

      - name: Write functions/.env (secrets)
        run: echo "SAMSUNG_WEBHOOK_SECRET=${{ secrets.SAMSUNG_WEBHOOK_SECRET }}" > functions/.env

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: npx firebase-tools deploy --project ai-hub-21af9 --non-interactive --force
